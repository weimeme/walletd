# directory: /etc/walletd
autoOpenWebUI: true
http:
  address: :9980
  password: weaver
  publicEndpoints: false # when true, auth will be disabled on endpoints that should be publicly accessible when running walletd as a service
consensus:
  network: zen
syncer:
  bootstrap: true
  enableUPnP: false
  peers: ["40.160.12.62:9881","141.94.161.198:9881","15.204.141.235:9881","51.79.16.87:9881","141.94.161.198:9881","31.208.123.47:9881","62.30.63.90:9881","162.19.232.38:9881","15.204.160.10:10881","51.81.56.133:9881"]
  address: :9981
index:
  mode: full # personal, full, none ("full" will index the entire blockchain, "personal" will only index addresses that are registered in the wallet, "none" will treat the database as read-only and not index any new data)
  batchSize: 64 # max number of blocks to index at a time (increasing this will increase scan speed, but also increase memory and cpu usage)
log:
  level: info # global log level
  stdout:
    enabled: true # enable logging to stdout
    level: debug # override the global log level for stdout
    enableANSI: false
    format: human # human or JSON
  file:
    enabled: true # enable logging to a file
    level: debug # override the global log level for the file
    path: /var/log/walletd.log
    format: json # human or JSON
